<title>화학 아케이드 — 고1 화학 복습 게임 모음</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0d1611;
    --bg-2: #0a100c;
    --panel: #16211a;
    --panel-2: #1d2b22;
    --line: #2c3e32;
    --line-soft: #223129;
    --ink: #eef2ea;
    --ink-dim: #9db1a2;
    --accent: #ff8a3d;
    --neutral: #4fd68c;
    --danger: #ff5470;
  }
  :root[data-theme="light"] {
    --bg: #eef1ea;
    --bg-2: #e3e8dd;
    --panel: #ffffff;
    --panel-2: #f4f6f0;
    --line: #c9d2c1;
    --line-soft: #d9e0d1;
    --ink: #16211a;
    --ink-dim: #506056;
    --accent: #d9631a;
    --neutral: #1f9d63;
    --danger: #c8264a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1ea;
      --bg-2: #e3e8dd;
      --panel: #ffffff;
      --panel-2: #f4f6f0;
      --line: #c9d2c1;
      --line-soft: #d9e0d1;
      --ink: #16211a;
      --ink-dim: #506056;
      --accent: #d9631a;
      --neutral: #1f9d63;
      --danger: #c8264a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 40px 14px 48px;
    background: radial-gradient(ellipse at 50% -10%, var(--line-soft) 0%, transparent 60%), var(--bg);
    min-height: 100vh;
  }
  .mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .rig { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 28px; }

  .hero { text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .hero .eyebrow { font-size: 12px; letter-spacing: 0.16em; color: var(--ink-dim); font-family: "JetBrains Mono", ui-monospace, monospace; }
  .hero h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .hero p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.6; }

  .nick-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .nick-card label { font-size: 13px; font-weight: 700; color: var(--ink-dim); letter-spacing: 0.02em; }
  .nick-row { display: flex; gap: 10px; }
  .nick-row input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; color: var(--ink); font-family: inherit;
  }
  .nick-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nick-status { font-size: 12.5px; color: var(--ink-dim); min-height: 1.2em; }
  .nick-status.ok { color: var(--neutral); }

  .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .game-card {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; text-decoration: none; color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
  }
  .game-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .game-card.disabled { opacity: 0.45; pointer-events: none; }
  .game-card .icon { font-size: 30px; line-height: 1; }
  .game-card .unit-badge {
    align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    padding: 3px 10px; border-radius: 999px;
  }
  .game-card .title { font-size: 17px; font-weight: 800; text-wrap: balance; }
  .game-card .desc { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .game-card .champ { font-size: 11.5px; color: var(--ink-dim); margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line-soft); }
  .game-card .champ b { color: var(--accent); }

  .footnote { text-align: center; font-size: 12px; color: var(--ink-dim); }

  @media (max-width: 560px) {
    .hero h1 { font-size: 26px; }
    .game-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="rig">
  <div class="hero">
    <span class="eyebrow">2022 개정 교육과정 · 고등학교 화학</span>
    <h1>화학 아케이드</h1>
    <p>단원별 개념을 게임으로 복습해보세요. 별명을 입력하고 원하는 게임을 골라 시작하면 됩니다.</p>
  </div>

  <div class="nick-card">
    <label for="nickInput">플레이어 별명</label>
    <div class="nick-row">
      <input type="text" id="nickInput" maxlength="12" placeholder="예: 화학마스터" autocomplete="off" />
    </div>
    <span class="nick-status" id="nickStatus">별명을 입력하면 게임을 시작할 수 있어요.</span>
  </div>

  <div class="game-grid" id="gameGrid"></div>

  <p class="footnote">각 게임 결과 화면과 이 목록에서 단원별 최고 기록을 확인할 수 있습니다.</p>
</div>

<script>
(() => {
  const NICK_KEY = "chemArcadeNickname";

  const GAMES = [
    {
      id: "mole",
      unit: "1단원",
      title: "몰과 화학반응식의 양적 관계",
      desc: "몰비·몰-질량 변환·한계반응물 판단을 다루는 슈팅 게임",
      icon: "⚖️",
      href: "mole.html",
    },
    {
      id: "shape",
      unit: "2단원",
      title: "분자 모양 퀴즈",
      desc: "VSEPR 모형에 따른 분자 모양을 맞히는 카드 클릭 퀴즈",
      icon: "🔷",
      href: "shape.html",
    },
    {
      id: "equilibrium",
      unit: "3단원",
      title: "화학평형 이동 시뮬레이터",
      desc: "르샤틀리에 원리로 평형 이동 방향을 예측하는 시뮬레이터",
      icon: "⚗️",
      href: "equilibrium.html",
    },
    {
      id: "titration",
      unit: "4단원",
      title: "중화 적정 슈팅",
      desc: "산-염기 중화반응의 당량(n·M·V)을 계산해 명중시키는 슈팅 게임",
      icon: "🧪",
      href: "titration.html",
    },
  ];

  const nickInput = document.getElementById("nickInput");
  const nickStatus = document.getElementById("nickStatus");
  const gameGrid = document.getElementById("gameGrid");

  function getHighscore(id) {
    try { return JSON.parse(localStorage.getItem(`chemArcadeHighscore_${id}`)); } catch (e) { return null; }
  }

  function renderCards() {
    const hasNick = nickInput.value.trim().length > 0;
    gameGrid.innerHTML = "";
    GAMES.forEach((g) => {
      const record = getHighscore(g.id);
      const card = document.createElement("a");
      card.className = "game-card" + (hasNick ? "" : " disabled");
      card.href = g.href;
      card.innerHTML = `
        <span class="icon">${g.icon}</span>
        <span class="unit-badge">${g.unit}</span>
        <span class="title">${g.title}</span>
        <span class="desc">${g.desc}</span>
        <span class="champ">${record ? `🏆 최고 기록 <b>${escapeHtml(record.name)}</b> · ${record.score}점` : "아직 기록 없음"}</span>
      `;
      gameGrid.appendChild(card);
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function saveNick() {
    const v = nickInput.value.trim();
    if (v) {
      localStorage.setItem(NICK_KEY, v);
      nickStatus.textContent = `"${v}" 님, 게임을 선택해 시작하세요!`;
      nickStatus.classList.add("ok");
    } else {
      localStorage.removeItem(NICK_KEY);
      nickStatus.textContent = "별명을 입력하면 게임을 시작할 수 있어요.";
      nickStatus.classList.remove("ok");
    }
    renderCards();
  }

  nickInput.value = localStorage.getItem(NICK_KEY) || "";
  nickInput.addEventListener("input", saveNick);
  saveNick();
})();
</script>
